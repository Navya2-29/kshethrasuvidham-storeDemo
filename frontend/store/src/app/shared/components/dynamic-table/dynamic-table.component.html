<!-- SEARCH -->
<div class="search-container">
  <input
    class="searchiput"
    (keyup)="applyFilter($event)"
    placeholder="Search..."
  />
</div>

<!-- TABLE -->
<table mat-table [dataSource]="dataSource" matSort class="custom-table">
  <!-- INDEX -->
  <ng-container matColumnDef="index">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let row; let i = index">
      {{ i + 1 }}
    </td>
  </ng-container>

  <!-- DYNAMIC COLUMNS -->
  <ng-container *ngFor="let col of columns" [matColumnDef]="col.columnDef">
    <th
      mat-header-cell
      *matHeaderCellDef
      [mat-sort-header]="col.sortable ? col.columnDef : ''"
    >
      {{ col.header }}
    </th>

    <td mat-cell *matCellDef="let row">
      {{ row[col.columnDef] }}
    </td>
  </ng-container>

  <!-- ACTION -->
  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef>Action</th>
    <td mat-cell *matCellDef="let row">
      <a
        (click)="onEdit(row)"
        class="btn btn-theme-light btn-xs btn-icon waves-effect waves-light action-col"
        data-toggle="tooltip"
        data-placement="top"
        title="Edit"
        data-original-title="Edit Details"
        ><i class="fa fa-edit"></i
      ></a>

      <a
        (click)="onDelete(row)"
        class="btn btn-theme-light btn-xs btn-icon waves-effect waves-light action-col"
        data-toggle="modal"
        data-placement="top"
        title="Delete Details"
        data-original-title="Delete"
        ><i class="fa fa-times"></i
      ></a>
    </td>
  </ng-container>

  <!-- ROWS -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  <!-- EMPTY -->
  <tr *matNoDataRow>
    <td [attr.colspan]="displayedColumns.length" class="no-data-cell">No data found</td>
  </tr>
</table>

<!-- PAGINATION -->
<mat-paginator
  [pageSize]="5"
  [pageSizeOptions]="[5, 10, 20]"
  showFirstLastButtons
>
</mat-paginator>
