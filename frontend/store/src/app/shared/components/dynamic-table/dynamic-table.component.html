<!-- SEARCH -->
<div class="search-container">
  <input class="searchiput" (keyup)="applyFilter($event)" placeholder="Search . . ." />
</div>

<!-- TABLE -->
<table mat-table [dataSource]="dataSource" matSort class="custom-table">
  <!-- INDEX -->
  <ng-container matColumnDef="index">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let row; let i = index">
      {{ i + 1 }}
    </td>
  </ng-container>

  <!-- DYNAMIC COLUMNS -->
  <ng-container *ngFor="let col of columns" [matColumnDef]="col.columnDef">
    <th mat-header-cell *matHeaderCellDef [mat-sort-header]="col.sortable ? col.columnDef : ''">
      {{ col.header }}
    </th>

    <td mat-cell *matCellDef="let row">
      {{ row[col.columnDef] }}
    </td>
  </ng-container>

  <!-- ACTION -->
  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef>Action</th>
    <td mat-cell *matCellDef="let row">
      <a (click)="onEdit(row)" class="btn btn-theme-light btn-xs btn-icon waves-effect waves-light action-col"
        data-toggle="tooltip" data-placement="top" title="Edit" data-original-title="Edit Details">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </a>

      <a (click)="onDelete(row)" class="btn btn-theme-light btn-xs btn-icon waves-effect waves-light action-col"
        data-toggle="modal" data-placement="top" title="Delete Details" data-original-title="Delete">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </a>
    </td>
  </ng-container>

  <!-- ROWS -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  <!-- EMPTY -->
  <tr *matNoDataRow>
    <td [attr.colspan]="displayedColumns.length" class="no-data-cell">No data found</td>
  </tr>
</table>

<!-- PAGINATION -->
<mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
</mat-paginator>
