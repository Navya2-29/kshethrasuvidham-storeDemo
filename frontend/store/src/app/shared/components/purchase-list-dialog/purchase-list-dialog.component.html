<h2>Purchase List</h2>

<!-- 🔍 Search -->
<input
  type="text"
  placeholder="Search invoice / supplier..."
  [(ngModel)]="searchText"
  class="form-control mb-2"
/>

<!-- 📋 Table -->
<table mat-table [dataSource]="filteredData" class="mat-elevation-z8">

  <ng-container matColumnDef="invoice_no">
    <th mat-header-cell *matHeaderCellDef>Invoice</th>
    <td mat-cell *matCellDef="let row">{{ row.invoice_no }}</td>
  </ng-container>

  <ng-container matColumnDef="supplier_name">
    <th mat-header-cell *matHeaderCellDef>Supplier</th>
    <td mat-cell *matCellDef="let row">{{ row.supplier_name }}</td>
  </ng-container>

  <ng-container matColumnDef="invoice_date">
    <th mat-header-cell *matHeaderCellDef>Invoice Date</th>
    <td mat-cell *matCellDef="let row">{{ row.invoice_date }}</td>
  </ng-container>

  <ng-container matColumnDef="receipt_date">
    <th mat-header-cell *matHeaderCellDef>Receipt Date</th>
    <td mat-cell *matCellDef="let row">{{ row.receipt_date }}</td>
  </ng-container>

  <ng-container matColumnDef="bill_amount">
    <th mat-header-cell *matHeaderCellDef>Bill</th>
    <td mat-cell *matCellDef="let row">{{ row.bill_amount }}</td>
  </ng-container>
  <ng-container matColumnDef="action">
  <th mat-header-cell *matHeaderCellDef>Action</th>
  <td mat-cell *matCellDef="let row">

    <button class="btn btn-sm btn-primary mr-1"
      (click)="onEdit(row)">
      Edit
    </button>

    <!-- <button class="btn btn-sm btn-danger"
      (click)="onDelete(row)">
      Delete
    </button> -->

  </td>
</ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
