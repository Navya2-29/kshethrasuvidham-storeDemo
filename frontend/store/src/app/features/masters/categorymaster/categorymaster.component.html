 <app-master-layout
  title="Category List"
  [formTitle]="editMode ? 'Update Category' : 'Add Category'">

  <!-- FORM -->
  <div form>
 <app-dynamic-form
      [form]="form"
      [fields]="fields"
      [editMode]="editMode"
      [loading]="loading"
      (submit)="save($event)"
      (cancel)="reset()">
    </app-dynamic-form>
  </div>

  <!-- TABLE -->
  <div table>
    <app-dynamic-table
      [columns]="columns"
      [data]="categories"
      (edit)="editCategory($event)"
      (delete)="deleteCategory($event)">
    </app-dynamic-table>
  </div>

</app-master-layout>
