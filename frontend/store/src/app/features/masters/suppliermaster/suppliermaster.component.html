<app-master-layout
  title="Supplier List"
  [formTitle]="editMode ? 'Update Supplier' : 'Add Supplier'">

  <div form>
    <app-dynamic-form
      [form]="form"
      [fields]="fields"
      [editMode]="editMode"
      [loading]="loading"
      (submit)="save($event)"
      (cancel)="reset()">
    </app-dynamic-form>
  </div>

  <div table>
    <app-dynamic-table
      [columns]="columns"
      [data]="suppliers"
      (edit)="editSupplier($event)"
  (delete)="deleteSupplier($event)">
    </app-dynamic-table>
  </div>

</app-master-layout>
