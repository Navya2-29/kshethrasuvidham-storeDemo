<div class="container-fluid mt-3">
  <!-- ================= AUTHOR SECTION ================= -->
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-warning">
      <h5 class="mb-0">Author Master</h5>
    </div>

    <div class="card-body">
      <div class="row mb-3">
        <div class="col-md-6">
           <input
      type="text"
      class="form-control"
      [(ngModel)]="authorName"
      placeholder="Enter Author Name"
      name="authorName"
      #authorModel="ngModel"
      required
      maxlength="200"
    />

    <!-- ✅ ERROR -->
    <div class="text-danger mt-1"
         *ngIf="!authorName.trim() && (authorModel.touched || authorSubmitted)">
      Author name is required
    </div>
  </div>


        <div class="col-md-2">
          <button class="btn btn-theme waves-effect waves-light w-100 btnsubmt" [disabled]="savingAuthor" (click)="save()">
            <i class="fa fa-save mr-1"></i>
            {{ savingAuthor ? "Saving..." : (authorEditId ? "Update" : "Save") }}
          </button>
        </div>

        <div class="col-md-2">
          <button class="btn btn-secondary waves-effect waves-light w-100 btnsubmt" [disabled]="savingAuthor" (click)="resetAuthor()">
            Clear
          </button>
        </div>
      </div>

      <table class="table table-bordered table-hover">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Author Name</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let a of authors; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ a.author_name }}</td>
            <td>
              <button
                class="btn btn-sm btn-primary me-2"
                (click)="editAuthor(a)"
              >
                Edit
              </button>

              <button
                class="btn btn-sm btn-danger"
                (click)="deleteAuthor(a.id)"
              >
                Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ================= PUBLISHER SECTION ================= -->
  <div class="card shadow-sm">
    <div class="card-header bg-info text-white">
      <h5 class="mb-0">Publisher Master</h5>
    </div>

    <div class="card-body">
      <div class="row mb-3">
        <div class="col-md-6">
          <input
      type="text"
      class="form-control"
      [(ngModel)]="publisherName"
      placeholder="Enter Publisher Name"
      name="publisherName"
      #publisherModel="ngModel"
      required
      maxlength="200"
    />

    <!-- ✅ ERROR -->
    <div class="text-danger mt-1"
         *ngIf="!publisherName.trim() && (publisherModel.touched || publisherSubmitted)">
      Publisher name is required
    </div>
        </div>

        <div class="col-md-2">
          <button class="btn btn-theme waves-effect waves-light w-100 btnsubmt" [disabled]="savingPublisher" (click)="savePublisher()">
            <i class="fa fa-save mr-1"></i>
            {{ savingPublisher ? "Saving..." : (publisherEditId ? "Update" : "Save") }}
          </button>
        </div>

        <div class="col-md-2">
          <button class="btn btn-secondary waves-effect waves-light w-100 btnsubmt" [disabled]="savingPublisher" (click)="resetPublisher()">
            Clear
          </button>
        </div>
      </div>

      <table class="table table-bordered table-hover">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Publisher Name</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let p of publishers; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ p.publisher_name }}</td>
            <td>
              <button
                class="btn btn-sm btn-primary me-2"
                (click)="editPublisher(p)"
              >
                Edit
              </button>

              <button
                class="btn btn-sm btn-danger"
                (click)="deletePublisher(p.id)"
              >
                Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
