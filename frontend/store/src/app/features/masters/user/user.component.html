<app-master-layout
  title="User List"
  [formTitle]="editMode ? 'Update User' : 'Add User'">

  <!-- FORM -->
  <div form>
    <app-dynamic-form
      [form]="form"
      [fields]="fields"
      [editMode]="editMode"
      [loading]="loading"
      (submit)="save($event)"
      (cancel)="reset()">
    </app-dynamic-form>
  </div>

  <!-- TABLE -->
  <div table>
    <app-dynamic-table
      [columns]="columns"
      [data]="users"
      (edit)="editUser($event)"
      (delete)="deleteUser($event)">
    </app-dynamic-table>
  </div>

</app-master-layout>
