<app-master-layout title="User details" formTitle="Update Password">
  <!-- LEFT SIDE -->
  <div form>
    <app-dynamic-form
      [form]="form"
      [fields]="fields"
      [editMode]="editMode"
      [loading]="loading"
      (submit)="save($event)"
      (cancel)="reset()"
    >
    </app-dynamic-form>
  </div>

  <!-- RIGHT SIDE -->
  <div table>
    <div class="user-info-card">
      <div class="info-row">
        <label>ID</label>
        <span>{{ user()?.id }}</span>
      </div>
      <div class="info-row">
        <label>Name</label>
        <span>{{ user()?.username }}</span>
      </div>

      <div class="info-row">
        <label>Email</label>
        <span>{{ user()?.email }}</span>
      </div>

      <div class="info-row">
        <label>Phone</label>
        <span>{{ user()?.mobile }}</span>
      </div>

      <div class="info-row">
        <label>Role</label>
        <span>{{ user()?.role }}</span>
      </div>
    </div>
  </div>
</app-master-layout>
