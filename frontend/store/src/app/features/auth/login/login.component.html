 <div class="loginpage" style="background-image: url('assets/images/bg3.jpg');background-size:cover;">
 <div class="account-pages mt-5 mb-5">
         <div class="container">
			<div class="row justify-content-center">
				<div class="col-md-6 col-lg-4 col-xl-4">
                  <div class="card">
                     <div class="card-body pl-3 pr-3 pt-1 pb-1">
                        <div class="text-center w-75 m-auto">
                          <br> <a href="index.html"> <span><img src="assets/images/logo.jpg" alt="" width="100" height="100"></span> </a><br>
                           <h4 class="mb-2 mt-1">Signin</h4>
                          
                        </div>
                         <form [formGroup]="loginForm">
                           <div class="form-group mb-2">
                              <label for="emailaddress">Email Id</label>
                              <input class="form-control" type="email" id="emailid" formControlName="username" name="emailid" required="" placeholder="Enter your Email Id">
                           </div>
                           <div class="form-group mb-3">
                              <label for="password">Password</label>
                              <input class="form-control" type="password" required="" id="password" formControlName="password" name="password"  placeholder="Enter your password">
                           </div>
                           <div class="form-group mb-0 text-center">
                              <button class="btn btn-theme btn-block" type="button" (click)=" login()"> Log In </button>
                           </div>
                           <div class="form-group mt-2 text-center"> <a href="forgot_password.html" class="text-bold text-black ml-1">Forgot your password?</a> </div>
                        </form>
                     </div>
                     <!-- end card-body -->
                  </div>
                  <!-- end card -->
               </div>
             
               <!-- end col -->
            </div>
            <!-- end row -->
         </div>
         <!-- end container -->
      </div>
      </div>
