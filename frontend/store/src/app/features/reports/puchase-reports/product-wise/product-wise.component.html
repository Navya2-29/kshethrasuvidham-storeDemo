<app-report-header (formSubmitted)="receiveData($event)"></app-report-header>

<div class="row" id="result">
  <div class="col-12">
    <div class="card">
      <div
        class="card-header border-bottom-0 bg-secondary text-white"
        style="padding: 12.6px"
      >
        <div>
          <span class="fa fa-file"></span>&nbsp;&nbsp;<span
            style="font-weight: 600; font-size: 13.2pt"
            >{{productname}} </span
          >-
          <span style="font-size: 12pt; font-weight: 500; color: #ffeacf"
            >{{ reportTitle }}
          </span>
        </div>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table
            id="basic-datatable"
            class="dt-responsive table-bordered nowrap"
          >
            <thead>
              <tr>
                <th class="text-center" style="width: 2%">#</th>
                <th class="text-center" style="width: 41%">Supplier name</th>
                <th class="text-center" style="width: 2%">Invoice No.</th>
                <th style="width: 2%">Invoice Date</th>
                <th style="width: 25%">Quantity</th>
                <th style="width: 5%">Rate</th>
                <th style="width: 4%">Amount</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of reportData; let i = index">
                <td>{{ i + 1 }}</td>
                <td>{{ item.supplier_name }}</td>
                <td>{{ item.invoice_no }}</td>
                <td>{{ item.invoice_date | date:'dd-MM-yyyy' }}</td>
                <td>{{ item.qty }}-{{item.unit}}</td>
                <td>₹ {{ item.cost_price }}</td>
                <td>₹ {{ item.amount }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer bg-default">
        <h4 class="text-secondary" style="font-weight: 500">
          Total: &#x20B9; {{totalAmount}}
        </h4>
      </div>
    </div>
  </div>
</div>
