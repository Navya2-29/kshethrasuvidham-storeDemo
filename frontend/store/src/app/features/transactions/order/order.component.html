<div class="row g-4">
  <div class="col-md-5 addsupplier">
    <div
      class=""
      style="
        border: 0px solid red;
        margin-top: -10.8px;
        margin-left: -10.8px;
        background: white;
        padding: 15pt;
        box-shadow: 1px 2px 8px silver;
        border-radius: 5px;
      "
    >
      <form [formGroup]="orderForm">
        <div class="row">
          <div class="col-sm-12">
            <!-- <div> <div style=" border: 0px solid red; position: absolute; right: -10px; top: -20px; padding: 6px; background: orange; color: white; " > <span>Add New Supplier</span> </div> </div> -->
            <div class="table-responsive" style="margin: 0px">
              <table>
                <tr>
                  <td>Order No<span class="mandatoryfiels">*</span></td>
                  <td>
                    <input
                      type="text"
                      formControlName="order_no"
                      id="order_no"
                      name="order_no"
                      style="
                        border: 1px solid silver;
                        width: 90px;
                        margin-left: 6px;
                      "
                      [readonly]="editMode"
                    />
                    <!-- <div
                      class="error"
                      *ngIf="
                        f.order_no.touched &&
                        f.order_no.hasError('required')
                      "
                    >
                      Supplier Code is required
                    </div> -->
                  </td>
                  <td></td>
                  <td></td>
                </tr>
                <tr>
                  <td>Supplier<span class="mandatoryfiels">*</span></td>
                  <td>
                    <select formControlName="supplier_id"  style="
                        border: 1px solid silver;
                        width: 180px;
                        margin-left: 6px;
                      ">
                <option value="">Select</option>
                <option *ngFor="let s of suppliers" [value]="s.id">
                  {{ s.supplier_name }}
                </option>
              </select>
                  </td>
                    <td></td>
                  <td></td>
                </tr>
                <tr>
                  <td>Order Date</td>
                  <td>
                    <input
                      type="text"
                      id="order_date"
                      name="order_date"
                      formControlName="order_date"
                      style="
                        border: 1px solid silver;
                        width: 180px;
                        margin-left: 6px;
                      "
                    />
                  </td>
                    <td></td>
                  <td></td>
                </tr>
                 <ng-container formArrayName="items">
                <tr *ngFor="let row of items.controls; let i=index" [formGroupName]="i">
                  
               <td>Product<span class="mandatoryfiels">*</span></td>   

              <td>
                <select formControlName="product_id"  style="
                        border: 1px solid silver;
                        width: 180px;
                        margin-left: 6px;
                      ">
                  <option value="">Select</option>
                  <option *ngFor="let p of products" [value]="p.id">
                    {{ p.product_name }}
                  </option>
                </select>
              </td>

              <td>
                <input type="number" formControlName="qty" />
              </td>

              <td *ngIf="items.length > 1">
                <button (click)="removeItem(i)">X</button>
              </td>
                </tr>
               </ng-container>
              </table>
            </div>
          </div>
          <div class="col-sm-12 mt-2">
            <div class="">
              <button
                type="button"
                
                class="btn btn-theme waves-effect waves-light"
                
              >
                <i class="remixicon-save-2-fill mr-1"></i>
                {{ editMode ? "Update" : "Save" }}
              </button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
  <div class="col-md-7 supplier-lists">
    <div class="card">
      <div
        class="card-header border-bottom-0"
        style="font-size: 12.3pt; padding: 9px"
      >
        <div class="card-title" style="font-size: 12.3pt; padding: 0px">
          &nbsp;&nbsp;<span class="fa fa-list"></span>&nbsp;&nbsp;Order List
        </div>
      </div>
      <div class="card-body" style="padding: 15px">
        <div class="table-responsive" style="margin: 0px">
          <div class="table-container">
            <!-- Filter -->
            <div class="search-container">
              <input
                class="searchiput"
                matInput
                (keyup)="applyFilter($event)"
                placeholder="Search..."
              />
            </div>
            <table
              mat-table
              [dataSource]="dataSource"
              matSort
              class="custom-table"
            >
              <!-- Index Column -->
              <ng-container matColumnDef="index">
                <th mat-header-cell *matHeaderCellDef>#</th>
                <td mat-cell *matCellDef="let element; let i = index">
                  {{ i + 1 }}
                </td>
              </ng-container>
              <!-- Supplier ID -->
              <ng-container matColumnDef="order_no">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  Supplier Code
                </th>
                <td mat-cell *matCellDef="let element">
                  {{ element.order_no }}
                </td>
              </ng-container>
              <!-- Company Name -->
              <ng-container matColumnDef="supplier_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  Company Name
                </th>
                <td mat-cell *matCellDef="let element">
                  {{ element.supplier_name }}
                </td>
              </ng-container>
              <!-- Mobile -->
              <ng-container matColumnDef="mobile_number">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  Mobile
                </th>
                <td mat-cell *matCellDef="let element">
                  {{ element.mobile_number }}
                </td>
              </ng-container>
              <!-- Action -->
              <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef>Action</th>
                <td mat-cell *matCellDef="let element">
                  <a
                   
                    class="btn btn-theme-light btn-xs btn-icon waves-effect waves-light action-col"
                    data-toggle="tooltip"
                    data-placement="top"
                    title="Edit"
                    data-original-title="Edit Details"
                    ><i class="fa fa-edit"></i
                  ></a>
                  <a
                   
                    class="btn btn-theme-light btn-xs btn-icon waves-effect waves-light action-col"
                    data-toggle="modal"
                    data-placement="top"
                    title="Delete Details"
                    data-original-title="Delete"
                    ><i class="fa fa-times"></i
                  ></a>
                </td>
              </ng-container>
              <!-- Header & Row -->
              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
              <!-- No Data -->
              <tr *matNoDataRow>
                <td colspan="5" class="text-center">No suppliers found</td>
              </tr>
            </table>
            <!-- Pagination -->
            <mat-paginator
              [pageSize]="5"
              [pageSizeOptions]="[5, 10, 20]"
              showFirstLastButtons
            >
            </mat-paginator>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
