<div class="row g-4 order-page">
  <div class="col-md-6 addsupplier">
    <div class="order-card">
      <form [formGroup]="orderForm">
        <!-- HEADER FIELDS -->
        <div class="row">
          <div class="col-md-6">
            <p class="mb-0">Order No</p>
            <input
              type="text"
              class="form-control"
              formControlName="order_no"
              id="order_no"
              name="order_no"
              readonly
            />
          </div>
          <div class="col-md-6">
            <p class="mb-0">Order Date<span class="mandatoryfiels">*</span></p>
            <input
              type="date"
              class="form-control"
              id="order_date"
              name="order_date"
              formControlName="order_date"
            />
          </div>

          <div class="col-md-4">
            <p class="mb-0">Supplier Code</p>
            <input
              type="text"
              class="form-control"
              formControlName="supplier_code"
              id="supplier_code"
              name="supplier_code"
              (input)="onSupplierCodeChange()"
            />
          </div>
          <div class="col-md-8">
            <p class="mb-0">Supplier<span class="mandatoryfiels">*</span></p>
            <select
              class="form-control"
              formControlName="supplier_id"
              (change)="onSupplierChange($event)"
            >
              <option value="">Select</option>
              <option *ngFor="let s of suppliers" [value]="s.id">
                {{ s.supplier_name }}
              </option>
            </select>
          </div>
        </div>

        <hr />

        <!-- ITEMS -->
        <div class="item-grid item-grid-head" [class.bookstore]="isBookstore">
          <div>Code</div>
          <div>Product<span class="mandatoryfiels">*</span></div>
          <div *ngIf="isBookstore">Author<span class="mandatoryfiels">*</span></div>
          <div *ngIf="isBookstore">Publisher<span class="mandatoryfiels">*</span></div>
          <div>Qty<span class="mandatoryfiels">*</span></div>
          <div></div>
        </div>

        <div formArrayName="items">
          <div
            class="item-grid item-row"
            [class.bookstore]="isBookstore"
            *ngFor="let row of items.controls; let i = index"
            [formGroupName]="i"
          >
            <div>
              <input
                type="text"
                class="form-control"
                formControlName="product_code"
                (input)="onProductCodeChange(i)"
              />
            </div>
            <div>
              <select
                class="form-control"
                formControlName="product_id"
                (change)="onProductChange($event, i)"
              >
                <option value="">Select</option>
                <option *ngFor="let p of products" [value]="p.id">
                  {{ p.product_code }} - {{ p.product_name }}
                </option>
              </select>
              <div class="error" *ngIf="row.get('product_id')?.touched && row.get('product_id')?.hasError('required')">
                Required
              </div>
            </div>

            <!-- Author / Publisher (Book Store only) -->
            <div *ngIf="isBookstore">
              <select class="form-control" formControlName="author_id">
                <option [ngValue]="null">Select</option>
                <option *ngFor="let a of rowProducts[i]?.authors" [ngValue]="a.id">
                  {{ a.author_name }}
                </option>
              </select>
              <div class="error" *ngIf="row.get('author_id')?.touched && row.get('author_id')?.hasError('required')">
                Required
              </div>
            </div>
            <div *ngIf="isBookstore">
              <select class="form-control" formControlName="publisher_id">
                <option [ngValue]="null">Select</option>
                <option *ngFor="let p of rowProducts[i]?.publishers" [ngValue]="p.id">
                  {{ p.publisher_name }}
                </option>
              </select>
              <div class="error" *ngIf="row.get('publisher_id')?.touched && row.get('publisher_id')?.hasError('required')">
                Required
              </div>
            </div>

            <div>
              <input type="text" class="form-control" formControlName="qty" />
              <div class="error" *ngIf="row.get('qty')?.touched && row.get('qty')?.invalid">
                &gt; 0
              </div>
            </div>

            <div class="item-row-action">
              <button
                type="button"
                class="btn-icon-sm btn-icon-danger"
                title="Remove row"
                [disabled]="items.length === 1"
                (click)="removeItem(i)"
              >
                <i class="fa fa-trash"></i>
              </button>
            </div>
          </div>
        </div>

        <button type="button" class="btn-add-item" (click)="addItem()">
          <i class="fa fa-plus mr-1"></i>Add Item
        </button>

        <div class="mt-3">
          <button
            type="button"
            class="btn btn-theme waves-effect waves-light"
            [disabled]="isSaving"
            (click)="onSubmit()"
          >
            <i class="remixicon-save-2-fill mr-1"></i>
            {{ isSaving ? "Saving..." : (editMode ? "Update" : "Save") }}
          </button>
        </div>
      </form>
    </div>
  </div>
  <div class="col-md-6 supplier-lists">
    <div class="card">
      <div
        class="card-header border-bottom-0"
        style="font-size: 12.3pt; padding: 9px"
      >
        <div class="card-title" style="font-size: 12.3pt; padding: 0px">
          &nbsp;&nbsp;<span class="fa fa-list"></span>&nbsp;&nbsp;Order List
        </div>
      </div>
      <div class="card-body" style="padding: 15px">
        <div class="table-responsive" style="margin: 0px">
          <div class="table-container">
            <!-- Filter -->
            <div class="search-container">
              <input
                class="searchiput"
                matInput
                (keyup)="applyFilter($event)"
                placeholder="Search..."
              />
            </div>
            <table
              mat-table
              [dataSource]="dataSource"
              matSort
              class="custom-table"
            >
              <!-- Index Column -->
              <ng-container matColumnDef="index">
                <th mat-header-cell *matHeaderCellDef>#</th>
                <td mat-cell *matCellDef="let element; let i = index">
                  {{ i + 1 }}
                </td>
              </ng-container>
              <!-- Supplier ID -->
              <ng-container matColumnDef="order_no">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  Order No
                </th>
                <td mat-cell *matCellDef="let element">
                  {{ element.order_no }}
                </td>
              </ng-container>
              <!-- Company Name -->
              <ng-container matColumnDef="supplier_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  Company Name
                </th>
                <td mat-cell *matCellDef="let element">
                  {{ element.supplier_name }}
                </td>
              </ng-container>
              <!-- Mobile -->
              <ng-container matColumnDef="order_date">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  Order Date
                </th>
                <td mat-cell *matCellDef="let element">
                  {{ element.order_date | date }}
                </td>
              </ng-container>
              <!-- Action -->
              <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef>Action</th>
                <td mat-cell *matCellDef="let element">
                  <a
                    class="btn btn-theme-light btn-xs btn-icon waves-effect waves-light action-col"
                    data-toggle="tooltip"
                    data-placement="top"
                    title="Edit"
                    data-original-title="Edit Details"
                    (click)="editOrder(element)"
                    ><i class="fa fa-edit"></i
                  ></a>
                  <a
                    class="btn btn-theme-light btn-xs btn-icon waves-effect waves-light action-col"
                    data-toggle="modal"
                    data-placement="top"
                    title="Delete Details"
                    data-original-title="Delete"
                    (click)="deleteOrder(element.id)"
                    ><i class="fa fa-times"></i
                  ></a>
                </td>
              </ng-container>
              <!-- Header & Row -->
              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
              <!-- No Data -->
              <tr *matNoDataRow>
                <td colspan="5" class="text-center">No suppliers found</td>
              </tr>
            </table>
            <!-- Pagination -->
            <mat-paginator
              [pageSize]="5"
              [pageSizeOptions]="[5, 10, 20]"
              showFirstLastButtons
            >
            </mat-paginator>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
