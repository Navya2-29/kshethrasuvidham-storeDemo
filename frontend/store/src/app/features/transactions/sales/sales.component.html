<form class="pos-screen" [formGroup]="salesForm">
  <!-- ================= HEADER ================= -->
  <div class="header-bar">
    <div class="field-box">
      <label>Order No</label>
      <input type="text" formControlName="order_no" />
    </div>

    <div class="field-box">
      <label>Invoice No</label>
      <input type="text" formControlName="invoice_no" readonly />
    </div>

    <div class="field-box">
      <label>Customer</label>
      <input type="text" formControlName="customer_name" />
    </div>

    <div class="field-box">
      <label>Mobile</label>
      <input type="text" formControlName="customer_mobile" />
    </div>

    <div class="field-box">
      <label>Date</label>
      <input type="date" formControlName="receipt_date" />
    </div>

    <div class="field-box" *ngIf="storeContext.isMultiDepartment()">
      <label>Department</label>
      <select
        formControlName="department_id"
        (change)="onDepartmentChange($event)"
      >
        <option value="">Select</option>

        <option *ngFor="let d of departments" [value]="d.id">
          {{ d.dept_name }}
        </option>
      </select>
    </div>
  </div>

  <!-- ================= PRODUCT SECTION ================= -->
  <div class="product-panel">
    <!-- GRID HEADER -->
    <div class="grid-head">
      <div>#</div>
      <div>Code</div>
      <div>Product</div>
      <div>Author</div>
      <div>Publisher</div>
      <div>Qty</div>
      <div>Unit</div>
      <div>MRP</div>
      <!-- <div>CP</div> -->
      <div>SP</div>
      <div>CG</div>
      <div>SG</div>
      <div>Amt</div>
      <div>+</div>
      <div>X</div>
    </div>

    <!-- GRID BODY -->
    <div class="grid-body" formArrayName="items">
      <div
        class="grid-row"
        *ngFor="let row of items.controls; let i = index"
        [formGroupName]="i"
      >
        <div class="row-no">{{ i + 1 }}</div>

        <input formControlName="product_code" />

        <div class="product-cell" style="position: relative">
          <select
            formControlName="product_id"
            (change)="onProductSelect($event, i)"
          >
            <option value="">Select Product</option>

            <option *ngFor="let p of products" [value]="p.id">
              {{ p.product_code }} - {{ p.product_name }}
            </option>
          </select>
        </div>

        <input formControlName="author" readonly />

        <input formControlName="publisher" readonly />

        <input type="number" formControlName="qty" [min]="1" />

        <input formControlName="unit" readonly />

        <input type="text" formControlName="mrp" readonly class="number" />

        <!-- <input type="number" formControlName="cost_price" readonly /> -->

        <input type="text" formControlName="selling_price" readonly class="number" />

        <input type="text" formControlName="cgst" readonly class="number" />

        <input type="text" formControlName="sgst" readonly class="number"/>

        <input type="text" formControlName="amount" readonly class="number"/>

        <button type="button" class="add-btn" (click)="addRow()">+</button>

        <button type="button" class="del-btn" (click)="removeRow(i)">×</button>
      </div>
    </div>
  </div>

  <!-- ================= FOOTER ================= -->
  <div class="footer-bar">
    <!-- ========= ROW 1 : TOTAL ========= -->
    <div class="footer-row totals-grid">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div class="footer-label">TOTAL</div>

      <input [value]="totalSellingPrice | number:'1.2-2'" readonly />
      <input [value]="totalCgst | number:'1.2-2'" readonly />
      <input [value]="totalSgst | number:'1.2-2'" readonly />
      <input formControlName="total_amount" readonly />

      <div></div>
      <div></div>
    </div>

    <!-- ========= ROW 2 : DISCOUNT ========= -->
    <div class="footer-row totals-grid">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>

      <div class="footer-label">DISCOUNT</div>

      <div></div>
      <div></div>
      <div></div>

      <!-- Amount column -->
    <input
  type="text"
  formControlName="discount"
/>

      <div></div>
      <div></div>
    </div>

    <!-- ========= ROW 3 : PAYMENT / BILL / SAVE ========= -->

    <div class="footer-row totals-grid">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div class="field-box" *ngIf="salesForm.value.payment_mode == 'Cheque'">
        <input formControlName="bank_name" placeholder="Bank" />
      </div>
      <div class="field-box" *ngIf="salesForm.value.payment_mode == 'Cheque'">
        <input formControlName="cheque_date" placeholder="Cheque Date" />
      </div>

      <div class="field-box" *ngIf="salesForm.value.payment_mode == 'Cheque'">
        <input formControlName="cheque_no" placeholder="Cheque No" />
      </div>

      <select class="paymode-box" formControlName="payment_mode">
        <option>Cash</option>
        <option>UPI</option>
        <option>Card</option>
        <option>Cheque</option>
      </select>

      <input class="bill-box" [value]="billAmount | number:'1.2-2'" readonly /> 

      <button type="button" class="save-btn save-wide" (click)="saveBill()">
        Save
      </button>
    </div>
  </div>
</form>
<!-- ================= RECEIPT (HIDDEN / AUTO PRINT) ================= -->
<app-receipt-print
  *ngIf="showReceipt"
  [bill]="receiptData">
</app-receipt-print>
