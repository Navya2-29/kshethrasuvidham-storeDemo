<div class="row g-4">
  <div class="col-md-5 addsupplier">
    <div
      class=""
      style="
        border: 0px solid red;
        margin-top: -10.8px;
        margin-left: -10.8px;
        background: white;
        padding: 15pt;
        box-shadow: 1px 2px 8px silver;
        border-radius: 5px;
      "
    >
      <form [formGroup]="openingForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-sm-12">
            <div class="table-responsive" style="margin: 0px">
              <table>
                <!-- Product -->
                <tr>
                  <td>Product <span class="mandatoryfiels">*</span></td>
                  <td>
                    <select
                      formControlName="product_id"
                      style="
                        border: 1px solid silver;
                        width: 240px;
                        margin-left: 6px;
                      "
                      (change)="onProductChange($event)"
                    >
                      <option value="">Select Product</option>
                      <option *ngFor="let p of products" [value]="p.id">
                        {{ p.product_name }}
                      </option>
                    </select>
                    <div
                      class="error"
                      *ngIf="f.product_id.touched && f.product_id.invalid"
                    >
                      Product is required
                    </div>
                  </td>
                </tr>

                <!-- Opening Quantity -->
                <tr>
                  <td>
                    Opening Quantity <span class="mandatoryfiels">*</span>
                  </td>
                  <td>
                    <input
                      type="number"
                      formControlName="qty"
                      min="0"
                      step="0.01"
                      (input)="calculateAmount()"
                      style="
                        border: 1px solid silver;
                        width: 120px;
                        margin-left: 6px;
                      "
                    />

                    <div class="error" *ngIf="f.qty.touched && f.qty.invalid">
                      Quantity is required
                    </div>
                  </td>
                </tr>


                <!-- Opening Date -->
                <tr>
                  <td>Opening Date <span class="mandatoryfiels">*</span></td>
                  <td>
                    <input
                      type="date"
                      formControlName="opening_date"
                      style="
                        border: 1px solid silver;
                        width: 140px;
                        margin-left: 6px;
                      "
                    />

                    <div
                      class="error"
                      *ngIf="f.opening_date.touched && f.opening_date.invalid"
                    >
                      Opening date required
                    </div>
                  </td>
                </tr>
              </table>
            </div>
          </div>
          <!-- Save Button -->
          <div class="col-sm-12 mt-3">
            <button
              type="submit"
              class="btn btn-theme waves-effect waves-light"
              [disabled]="openingForm.invalid"
            >
              <i class="remixicon-save-2-fill mr-1"></i>
              Save
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="col-md-7 supplier-lists">
    <div class="card">
      <div
        class="card-header border-bottom-0"
        style="font-size: 12.3pt; padding: 9px"
      >
        <div class="card-title" style="font-size: 12.3pt; padding: 0px">
          &nbsp;&nbsp;<span class="fa fa-list"></span>&nbsp;&nbsp;Opening List
        </div>
      </div>
      <div class="card-body" style="padding: 15px">
        <div class="table-responsive" style="margin: 0px">
          <div class="table-container">
            <!-- Filter -->
            <div class="search-container">
              <input class="searchiput" matInput placeholder="Search..." (keyup)="applyFilter($event)"/>
            </div>
            <table
              mat-table
              [dataSource]="dataSource"
              matSort
              class="custom-table"
            >
              <!-- Index Column -->
              <ng-container matColumnDef="index">
                <th mat-header-cell *matHeaderCellDef>#</th>
                <td mat-cell *matCellDef="let element; let i = index">
                  {{ i + 1 }}
                </td>
              </ng-container>

              <!-- Supplier ID -->
              <ng-container matColumnDef="product_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  Product
                </th>
                <td mat-cell *matCellDef="let element">
                  {{ element.product_name }}
                </td>
              </ng-container>

              <!-- Company Name -->
              <ng-container matColumnDef="qty">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Qty</th>
                <td mat-cell *matCellDef="let element">
                  {{ element.qty }}
                </td>
              </ng-container>

             

              <ng-container matColumnDef="opening_date">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
                <td mat-cell *matCellDef="let element">
                  {{ element.transaction_date | date }}
                </td>
              </ng-container>

              <!-- Header & Row -->
              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

              <!-- No Data -->
              <tr *matNoDataRow>
                <td colspan="5" class="text-center">No suppliers found</td>
              </tr>
            </table>

            <!-- Pagination -->
            <mat-paginator
              [pageSize]="5"
              [pageSizeOptions]="[5, 10, 20]"
              showFirstLastButtons
            >
            </mat-paginator>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
