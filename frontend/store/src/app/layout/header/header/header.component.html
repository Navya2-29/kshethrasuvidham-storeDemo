<div class="navbar-custom">
  <ul class="list-unstyled topnav-menu float-right mb-0">
    <li class="dropdown notification-list">
      <a class="nav-link nav-user" (click)="toggleProfile()">
        <img src="assets/images/user.jpg" class="rounded-circle" />
        <span class="pro-user-name ml-1">
          {{ user()?.username || "User" }} <i class="mdi mdi-chevron-down"></i>
        </span>
      </a>
      <div class="dropdown-menu dropdown-menu-right" [class.show]="show">
        <a class="dropdown-item">My Account</a>
 <div class="dropdown-divider"></div>
        <a class="dropdown-item" (click)="openChangePassword()">
    Change Password
  </a>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item" (click)="logout()">Logout</a>
      </div>
    </li>
  </ul>
  <div class="logo-box">
    <h1>
      <a routerLink="/dashboard" class="logo">SMS</a>
    </h1>
    <div class="department-label" *ngIf="storeContext.selectedDepartment() as dept">
      {{ dept.dept_name }}
    </div>
  </div>

  <ul class="list-unstyled topnav-menu topnav-menu-left m-0">
    <li>
      <button class="button-menu-mobile" (click)="toggleSidebar()">
        <i class="fe-menu"></i>
      </button>
      <span  *ngIf="settings$ | async as settings">{{ settings.client_name }}</span>
    </li>
  </ul>
</div>
