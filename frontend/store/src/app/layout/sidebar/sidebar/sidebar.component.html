<div class="left-side-menu" [class.compact]="!sidebarService.isOpen()">

  <!-- ================= BRAND / LOGO HEADER ================= -->
  <div class="sidebar-brand-box" [routerLink]="['/dashboard']">
    <ng-container *ngIf="settings$ | async as settings; else defaultBrand">
      <div class="brand-book-icon">
        <img
          [src]="settings?.logo ? getImageUrl(settings.logo) : 'assets/images/logo.png'"
          (error)="$any($event.target).src = 'assets/images/logo.png'"
          alt="Logo"
          class="brand-logo-img"
        />
      </div>
      <div class="brand-text" *ngIf="sidebarService.isOpen()">
        <span class="brand-title">{{ settings?.client_name || 'SMS' }}</span>
        <span class="brand-subtitle">
          {{ storeContext.selectedDepartment()?.dept_name || 'Books Deptm' }}
        </span>
      </div>
    </ng-container>

    <ng-template #defaultBrand>
      <div class="brand-book-icon">
        <img src="assets/images/logo.png" alt="Logo" class="brand-logo-img" />
      </div>
      <div class="brand-text" *ngIf="sidebarService.isOpen()">
        <span class="brand-title">SMS</span>
        <span class="brand-subtitle">
          {{ storeContext.selectedDepartment()?.dept_name || 'Books Deptm' }}
        </span>
      </div>
    </ng-template>
  </div>

  <!-- ================= NAVIGATION MENU ================= -->
  <div class="sidebar-nav-container">
    <ul class="nav-list">
      <ng-container *ngFor="let item of menuItems">
        <li class="nav-item">

          <!-- Root Item with direct Route (e.g. Dashboard) -->
          <a *ngIf="!item.children" class="nav-link-root" [routerLink]="item.route" routerLinkActive="active-root-item"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }">
            <div class="nav-link-left">
              <span class="nav-icon-wrap" [ngSwitch]="item.label">
                <!-- Dashboard (Home) -->
                <svg *ngSwitchCase="'Dashboard'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                  <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <!-- Settings (Gear) -->
                <svg *ngSwitchCase="'Settings'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                  </path>
                </svg>
                <!-- Fallback icon -->
                <i *ngSwitchDefault [class]="item.icon"></i>
              </span>
              <span class="nav-text" *ngIf="sidebarService.isOpen()">{{ item.label }}</span>
            </div>
          </a>

          <!-- Root Item with Dropdown Children (e.g. Masters, Transactions) -->
          <a *ngIf="item.children" class="nav-link-root" (click)="toggleMenu(item.label)"
            [class.menu-expanded]="openMenu() === item.label">
            <div class="nav-link-left">
              <span class="nav-icon-wrap" [ngSwitch]="item.label">
                <!-- Masters (4 Squares / Grid) -->
                <svg *ngSwitchCase="'Masters'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                  <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                  <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                  <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                </svg>
                <!-- Transactions (Card / Transfer / Flow) -->
                <svg *ngSwitchCase="'Transactions'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 1l4 4-4 4"></path>
                  <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                  <path d="M7 23l-4-4 4-4"></path>
                  <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                </svg>
                <!-- Reports (Chart / Analytics) -->
                <svg *ngSwitchCase="'Reports'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="20" x2="18" y2="10"></line>
                  <line x1="12" y1="20" x2="12" y2="4"></line>
                  <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
                <!-- Fallback icon -->
                <i *ngSwitchDefault [class]="item.icon"></i>
              </span>
              <span class="nav-text" *ngIf="sidebarService.isOpen()">{{ item.label }}</span>
            </div>

            <svg *ngIf="sidebarService.isOpen()" class="nav-arrow-chevron" [class.open]="openMenu() === item.label"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </a>

          <!-- Sub-menu Items (Level 2) -->
          <div *ngIf="item.children" class="nav-sub-container" [class.open]="openMenu() === item.label"
            [class.collapsed]="!sidebarService.isOpen()">
            <ul class="nav-sub-list">
              <ng-container *ngFor="let child of item.children">
                <li class="nav-sub-item"
                  *ngIf="(!child.bookstoreOnly || isBookstore()) && (!child.multiDepartmentOnly || storeContext.isMultiDepartment())">
                  <a class="nav-sub-link" [routerLink]="child.route" routerLinkActive="active-sub-item"
                    (click)="child.children ? toggleSubMenu(child.label) : null">
                    <span class="sub-dot"></span>
                    <span class="sub-text">{{ child.label }}</span>
                  </a>

                  <!-- Third Level (if any) -->
                  <div *ngIf="child.children" class="nav-grandchild-container"
                    [class.open]="openSubMenu() === child.label" [class.collapsed]="!sidebarService.isOpen()">
                    <ul class="nav-grandchild-list">
                      <li *ngFor="let grandChild of child.children">
                        <a class="nav-grandchild-link" [routerLink]="grandChild.route"
                          routerLinkActive="active-grandchild-item">
                          <span class="sub-dot-mini"></span>
                          <span>{{ grandChild.label }}</span>
                        </a>
                      </li>
                    </ul>
                  </div>
                </li>
              </ng-container>
            </ul>
          </div>

        </li>
      </ng-container>
    </ul>
  </div>

</div>
